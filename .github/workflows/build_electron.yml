name: Build Electron desktop installer

# El instalador de escritorio: ventana nativa propia (Electron + NSIS) sobre el
# mismo motor Python. NSIS da elegir carpeta, icono en el escritorio, entrada
# en el menú Inicio y desinstalador (ver `build.nsis` en desktop/package.json).
#
# Antes esto SÓLO corría con un tag `v*` o a mano: en toda una serie de
# cambios al producto no se disparó ni una vez, y el instalador de escritorio
# nunca se llegó a construir. Los otros dos builds (build_windows.yml,
# build_windows_owner.yml) sí escuchan push a main; éste quedaba afuera y nada
# lo avisaba, porque un workflow que no corre no falla.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Lo que termina adentro del instalador. Misma lista que build_windows.yml.
    paths:
      - "packaging/**"
      - "mvpm/**"
      - "app/**"
      - "requirements.txt"
      - "desktop/**"
      - ".github/workflows/build_electron.yml"
  workflow_dispatch: {}

# Runner de Windows: se cobra al doble y este build tarda más que los otros
# porque encima compila Electron. Dos pushes seguidos no pagan dos veces.
concurrency:
  group: build-electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Cython setuptools

      # Mismo endurecimiento que build_windows.yml: mvpm/*.py se compila a
      # .pyd nativo y el .py original se borra antes de que PyInstaller arme
      # el motor que después Electron empaqueta — el .asar de Electron no
      # cifra nada por sí solo, así que sin este paso el código fuente
      # también quedaría a la vista en el instalador de escritorio.
      - name: Compilar mvpm/ a binario nativo (Cython)
        run: |
          python packaging/setup_cython.py build_ext --inplace
          python packaging/strip_py_sources.py

      - name: Compilar el motor (PyInstaller) — sin Node ni Python en la PC del usuario
        run: pyinstaller packaging/mvpm.spec --distpath dist --workpath build --noconfirm

      # PyInstaller ahora compila en onedir (ver packaging/mvpm.spec): deja una
      # CARPETA, no un .exe suelto. Se copia entera a los recursos de Electron.
      - name: Copiar el motor a los recursos de Electron
        run: Copy-Item -Recurse -Force dist/MVProjectManagement desktop/resources/motor

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias de Electron
        working-directory: desktop
        run: npm ci

      - name: Compilar el instalador de escritorio (Electron + NSIS)
        working-directory: desktop
        run: npm run dist

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MVProjectManagement-Desktop-Windows
          path: desktop/release/*.exe

      - name: Publicar en el release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
