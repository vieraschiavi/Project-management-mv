name: Build Windows installer

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "packaging/**"
      - "mvpm/**"
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/build_windows.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Cython setuptools

      # Protección del código fuente: mvpm/*.py se compila a .pyd nativo
      # (ver packaging/setup_cython.py) y el .py original se borra ANTES de
      # que PyInstaller arme el .exe — así quien descomprima el instalador
      # (demo o pago) nunca se lleva el código fuente en texto plano. No es
      # irrompible ante alguien decidido con un desensamblador, pero saca el
      # escenario de "extraer y copiar" de la ecuación. app/app.py queda
      # afuera a propósito: Streamlit lo necesita como .py real para poder
      # correr `streamlit run <script>`.
      - name: Compilar mvpm/ a binario nativo (Cython)
        run: |
          python packaging/setup_cython.py build_ext --inplace
          python packaging/strip_py_sources.py

      - name: Compilar ejecutable (PyInstaller)
        run: pyinstaller packaging/mvpm.spec --distpath dist --workpath build --noconfirm

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\instalador.iss

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MVProjectManagement-Setup-Windows
          path: packaging/Output/*.exe

      - name: Publicar en el release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/*.exe

      # El repo es privado a propósito: un asset de GitHub Release no es
      # descargable por un visitante anónimo de la landing sin loguearse. Se
      # publica el .exe en Vercel Blob (URL pública estable) para que
      # api/download-installer.js pueda redirigir ahí sin exponer el repo.
      # Sin el secret configurado, este paso se salta solo — no rompe el
      # build ni bloquea el resto del workflow.
      - name: Publicar el instalador en Vercel Blob (descarga pública)
        if: env.BLOB_READ_WRITE_TOKEN != ''
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        shell: bash
        run: |
          npm install @vercel/blob --no-save --silent
          node packaging/publish_blob.js
