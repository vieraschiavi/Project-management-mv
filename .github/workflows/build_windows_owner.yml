name: Build Windows installer (Owner Edition)

# Build separado del instalador normal (build_windows.yml). El .exe que sale
# trae adentro un marcador de owner FIRMADO (ver packaging/mvpm_launcher.py +
# packaging/firmar_marcador_owner.py) — sin candado de prueba de 7 días ni
# límite de cupo de IA, y sin que el dueño tenga que configurar nada en su PC:
# instala y abre. Nunca se dispara con push a main ni se publica en Vercel Blob:
# sólo corre a mano (workflow_dispatch) o con un tag owner-v*, y el .exe
# resultante queda SOLO como artefacto de Actions y, en tags, como asset de
# un GitHub Release — visible nada más que para quien tiene acceso a este
# repo privado.
on:
  push:
    tags:
      - "owner-v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Cython setuptools

      # Antes de compilar: el marcador que hace que este .exe sea el del dueño
      # es una licencia firmada, así que se genera acá con el secreto y no vive
      # en el repo. Si el secreto falta, el paso corta el build en vez de dejar
      # salir un "Owner Edition" que se comporta como el de un cliente.
      - name: Firmar el marcador de Owner Edition
        env:
          MVPM_LICENSE_PRIVATE_KEY: ${{ secrets.MVPM_LICENSE_PRIVATE_KEY }}
        run: python packaging/firmar_marcador_owner.py

      - name: Compilar mvpm/ a binario nativo (Cython)
        run: |
          python packaging/setup_cython.py build_ext --inplace
          python packaging/strip_py_sources.py

      - name: Compilar ejecutable Owner Edition (PyInstaller)
        run: pyinstaller packaging/mvpm_owner.spec --distpath dist --workpath build --noconfirm

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador Owner Edition (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\instalador_owner.iss

      - name: Subir instalador como artefacto (sólo visible en este repo)
        uses: actions/upload-artifact@v4
        with:
          name: MVProjectManagement-Owner-Setup-Windows
          path: packaging/Output/*.exe

      # A diferencia de build_windows.yml, esto NUNCA se publica en Vercel
      # Blob ni se linkea desde la landing — el Release de GitHub ya es
      # privado (mismo repo privado), así que alcanza como canal de descarga
      # exclusivo para el owner.
      - name: Publicar en un Release de GitHub (sólo en tags owner-v*)
        if: startsWith(github.ref, 'refs/tags/owner-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/*.exe
          name: "Owner Edition ${{ github.ref_name }}"
          # prerelease para que este Release NUNCA quede como "Latest release"
          # del repo: si mañana se publican releases de cliente, el que la
          # gente ve primero no puede ser el del dueño.
          prerelease: true
          body: |
            **Instalador de la Owner Edition — uso exclusivo del dueño.**

            Trae adentro un marcador de licencia firmado, así que corre sin la
            prueba de 7 días y sin límite de cupo de IA, en cualquier máquina
            donde se instale y sin configurar nada.

            Por eso mismo **este .exe no se comparte con nadie**: quien lo tenga
            tiene el producto desbloqueado. Es un asset de un repositorio
            privado y ahí tiene que quedarse — no va a la landing, no va a
            Vercel Blob, no se manda por mail.

            Los clientes usan el instalador normal (`build_windows.yml`), que
            sí pasa por la prueba y la licencia.
