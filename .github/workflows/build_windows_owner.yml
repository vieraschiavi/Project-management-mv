name: Build Windows installer (Owner Edition)

# Build separado del instalador normal (build_windows.yml): mismo programa, con
# AppId y carpeta propios para poder tener las dos versiones instaladas en la
# misma PC sin que una pise a la otra.
#
# El .exe ya NO trae ningún marcador de owner adentro. Lo traía, firmado, y el
# comentario que estaba acá decía que eso era seguro porque el Release quedaba
# "visible nada más que para quien tiene acceso a este repo privado". El repo es
# PÚBLICO: ese .exe —y el packaging/OWNER_EDITION versionado— le daban el
# producto pago a cualquiera que pasara. Ver packaging/mvpm_owner.spec.
#
# Ahora lo que desbloquea el modo dueño vive sólo en la máquina del dueño (su
# clave privada local, ver mvpm/owner.py), y el marcador se emite atado a esa
# máquina. Este build no necesita secretos y no produce nada desbloqueado.
#
# Se reconstruye solo cuando cambia el producto (ver `paths` abajo), igual que
# el de cliente. Sigue sin publicarse en Vercel Blob ni linkearse desde la
# landing: es el canal del dueño, aunque ya no sea eso lo que protege nada.
on:
  push:
    tags:
      - "owner-v*"
    # Además del tag, se reconstruye solo cuando cambia algo que va ADENTRO del
    # .exe. Antes había que acordarse de dispararlo a mano, así que el
    # instalador del dueño quedaba viejo sin que nada lo dijera: la copia que se
    # bajaba de Actions podía ser de semanas atrás y no tener los arreglos que
    # ya estaban en main.
    #
    # Mismos paths que build_windows.yml, porque los dos .exe empaquetan lo
    # mismo (ver `datas` en packaging/mvpm.spec y mvpm_owner.spec): app/ y
    # mvpm/, más el launcher de packaging/. api/ NO va adentro del .exe —
    # viaja sólo en el ZIP portable— así que no dispara reconstrucción.
    branches:
      - main
    paths:
      - "packaging/**"
      - "mvpm/**"
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/build_windows_owner.yml"
  workflow_dispatch: {}

# Si entran varios pushes seguidos a main, sólo interesa el último: los builds
# intermedios producirían instaladores que nadie va a bajar.
concurrency:
  group: build-owner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # commitear el .exe en INSTALADOR/

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Cython setuptools

      # Acá había dos pasos que firmaban un marcador de Owner Edition y lo
      # metían adentro del .exe. Se sacaron: el comentario que los justificaba
      # decía "se puede hacer porque este repo es privado", y el repo es
      # PÚBLICO. El marcador es una licencia enterprise firmada, así que
      # cualquiera que bajara este .exe —o el archivo versionado— tenía el
      # producto pago gratis. Ver packaging/mvpm_owner.spec.
      #
      # Este build ya no necesita ningún secreto, y tampoco produce nada que
      # desbloquee el producto por sí solo: el .exe se activa en la máquina del
      # dueño porque ahí está su clave privada local, no por lo que trae adentro.

      - name: Compilar mvpm/ a binario nativo (Cython)
        run: |
          python packaging/setup_cython.py build_ext --inplace
          python packaging/strip_py_sources.py

      - name: Compilar ejecutable Owner Edition (PyInstaller)
        run: pyinstaller packaging/mvpm_owner.spec --distpath dist --workpath build --noconfirm

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador Owner Edition (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\instalador_owner.iss

      # Deja el instalador en INSTALADOR/OWNER/ y lo commitea, para poder
      # bajarlo directo del repositorio sin entrar a Actions. El push usa
      # GITHUB_TOKEN, que no dispara workflows: no hay bucle con este mismo
      # build. Ver packaging/publicar_en_carpeta_instalador.ps1.
      - name: Publicar en INSTALADOR/OWNER/
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          ./packaging/publicar_en_carpeta_instalador.ps1 -Subcarpeta OWNER -Origen packaging/Output

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MVProjectManagement-Owner-Setup-Windows
          path: packaging/Output/*.exe

      # A diferencia de build_windows.yml, esto no se publica en Vercel Blob ni
      # se linkea desde la landing. Ojo con lo que eso significa y con lo que
      # NO: acá decía que el Release "ya es privado (mismo repo privado)" y por
      # eso alcanzaba como canal exclusivo del dueño. El repo es público, así
      # que este .exe lo puede bajar cualquiera. Es aceptable únicamente porque
      # ya no lleva nada adentro que desbloquee el producto — no porque el canal
      # sea privado, que no lo es.
      - name: Publicar en un Release de GitHub (sólo en tags owner-v*)
        if: startsWith(github.ref, 'refs/tags/owner-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/Output/*.exe
          name: "Owner Edition ${{ github.ref_name }}"
          # prerelease para que este Release NUNCA quede como "Latest release"
          # del repo: si mañana se publican releases de cliente, el que la
          # gente ve primero no puede ser el del dueño.
          prerelease: true
          body: |
            **Instalador de la Owner Edition — uso exclusivo del dueño.**

            Trae adentro un marcador de licencia firmado, así que corre sin la
            prueba de 7 días y sin límite de cupo de IA, en cualquier máquina
            donde se instale y sin configurar nada.

            Por eso mismo **este .exe no se comparte con nadie**: quien lo tenga
            tiene el producto desbloqueado. Es un asset de un repositorio
            privado y ahí tiene que quedarse — no va a la landing, no va a
            Vercel Blob, no se manda por mail.

            Los clientes usan el instalador normal (`build_windows.yml`), que
            sí pasa por la prueba y la licencia.
