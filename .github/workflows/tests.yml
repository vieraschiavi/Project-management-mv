name: Tests

# La red de seguridad de cada cambio: si los tests o el linter fallan, el job
# falla y el PR queda en rojo — no hay forma de mergear algo roto sin verlo.
# Corre en Linux, que es rápido y barato.
#
# ## Por qué el push está limitado a main
#
# Decía `push:` a secas, sin filtro de ramas, junto con `pull_request:`. O sea
# que cada commit de una rama con PR abierto disparaba la suite DOS VECES sobre
# el MISMO sha: una por el push y otra por el pull_request. Los dos runs
# idénticos, con el mismo resultado, cobrando los dos.
#
# Mientras el repositorio fue público daba lo mismo: GitHub no cobra minutos de
# Actions en repos públicos. Al pasarlo a privado, esos minutos empezaron a
# descontar de la cuota de la cuenta, y este workflow es el que más corre.
#
# La cobertura no cambia: `pull_request` cubre cualquier rama que vaya a
# mergearse, y `push` a main cubre lo que entra directo. Lo que se deja de
# pagar es la corrida repetida.
on:
  push:
    branches:
      - main
  pull_request:

# Un push arriba de otro deja al primero sin sentido: lo que importa es el
# último commit. Sin esto, tres pushes seguidos pagan tres corridas completas
# y las dos primeras se descartan igual.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Se instalan las dos listas por separado a propósito: si algún día una
      # dependencia de runtime se cuela sólo en requirements-dev.txt, el paso
      # de tests de abajo la va a encontrar igual, pero el build del instalador
      # (que sólo instala requirements.txt) rompería. Mantenerlas separadas
      # hace visible esa diferencia.
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Linter (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest tests/ -q

      # Las funciones serverless de pago son JavaScript, así que sus tests no
      # los levanta pytest. Sin este paso, toda la ruta del dinero —emitir la
      # licencia, firmarla y cobrar— quedaría sin cubrir en CI.
      - name: Tests de las funciones de pago (Node)
        run: |
          node tests/test_verify_payment.js
          node tests/test_licencias.js
          node tests/test_checkout.js
          node tests/test_rotar_claves.js
          node tests/test_metricas.js
          node tests/test_demo_y_descarga.js

      # La interfaz de escritorio: su lanzador se testea con Node puro (el
      # runtime de Electron no se puede bajar en todos los entornos) y el
      # bundle se construye para comprobar que compila y no baja nada de
      # internet. Sin esto, un error en la UI de React aparecería recién al
      # armar el instalador de Windows, que corre en otro workflow.
      - name: Interfaz de escritorio (React + lanzador)
        run: |
          node desktop/lib/server-manager.test.js
          cd desktop && npm install --no-save --silent esbuild react react-dom
          node scripts/build-ui.mjs
