<!-- Variante /en/ de la landing: existe para que un link compartido en inglés
     (WhatsApp/LinkedIn/X) muestre una tarjeta social en inglés real, no la
     española. El resto del sitio es una SPA con i18n 100% client-side
     (mvpm_lang en localStorage, sin rutas por idioma) — acá replicamos SOLO
     el <head>, con el mismo copy real que usa el selector de idioma en "/"
     (I18N.en.hero_h1/hero_lead), y redirigimos de inmediato a "/" con el
     idioma ya aplicado. Así los scrapers de redes (que no ejecutan JS ni
     siguen el refresh) ven meta tags en inglés, y una persona real cae en la
     página completa, ya en inglés. Mismo patrón en /pt/. -->
