[pytest]
# Warnings: el objetivo es que la suite corra en cero, pero sobre todo que un
# deprecado NUEVO en código propio rompa el build en vez de sumarse al ruido.
filterwarnings =
    # Cualquier deprecación que salga de nuestros módulos es un error, no un
    # aviso: así se arregla cuando se introduce y no dos versiones después.
    error::DeprecationWarning:mvpm.*
    error::DeprecationWarning:api.*
    error::PendingDeprecationWarning:mvpm.*
    error::FutureWarning:mvpm.*
    error::FutureWarning:api.*

    # Terceros que no podemos arreglar desde acá. Se silencian de a uno y con
    # el motivo escrito, nunca con un "ignore" general que taparía los nuestros.
    #
    # Starlette avisa que su TestClient usa httpx y que migrará a httpx2. Lo
    # dispara el propio import de fastapi.testclient, no nuestro código; se va
    # solo cuando FastAPI/Starlette actualicen su dependencia.
    #
    # Ojo con la categoría: StarletteDeprecationWarning hereda de UserWarning,
    # no de DeprecationWarning, aunque se llame así. Filtrarlo como
    # DeprecationWarning no lo agarra.
    ignore:Using .httpx. with .starlette.testclient. is deprecated:UserWarning
